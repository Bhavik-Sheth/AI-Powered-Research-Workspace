[project]
name = "research-os-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "saq[postgres]>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false
